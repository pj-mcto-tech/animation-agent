<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">
    Animation Agent Pipeline Architecture
  </text>

  <!-- Main Pipeline Container -->
  <rect x="50" y="80" width="700" height="450" fill="#f0f8ff" stroke="#000080" stroke-width="2" rx="15"/>
  <text x="400" y="110" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">
    Animation Pipeline System
  </text>

  <!-- Stage Boxes -->
  <rect x="80" y="140" width="150" height="80" fill="#e6f3ff" stroke="#000080" stroke-width="1" rx="10"/>
  <text x="155" y="165" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">
    Script Processing
  </text>
  <text x="155" y="185" font-family="Arial" font-size="12" text-anchor="middle">
    Text Scripts
  </text>

  <rect x="250" y="140" width="150" height="80" fill="#e6f3ff" stroke="#000080" stroke-width="1" rx="10"/>
  <text x="325" y="165" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">
    Timeline Generation
  </text>
  <text x="325" y="185" font-family="Arial" font-size="12" text-anchor="middle">
    LLM JSON Timeline
  </text>

  <rect x="420" y="140" width="150" height="80" fill="#e6f3ff" stroke="#000080" stroke-width="1" rx="10"/>
  <text x="495" y="165" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">
    Audio Coordination
  </text>
  <text x="495" y="185" font-family="Arial" font-size="12" text-anchor="middle">
    Audio Assets
  </text>

  <rect x="590" y="140" width="150" height="80" fill="#e6f3ff" stroke="#000080" stroke-width="1" rx="10"/>
  <text x="665" y="165" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">
    Asset Packaging
  </text>
  <text x="665" y="185" font-family="Arial" font-size="12" text-anchor="middle">
    Cartoon Animator
  </text>

  <!-- Data Flow Arrows -->
  <line x1="230" y1="180" x2="250" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="180" x2="420" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="180" x2="590" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data Storage -->
  <rect x="325" y="250" width="150" height="60" fill="#fff0f5" stroke="#8b0000" stroke-width="1" rx="10"/>
  <text x="400" y="275" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">
    Shared Storage Pool
  </text>
  <text x="400" y="295" font-family="Arial" font-size="12" text-anchor="middle">
    /mnt/shared_storage
  </text>

  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="550" y="500" width="200" height="80" fill="#ffffff" stroke="#000000" stroke-width="1" rx="5"/>
  <text x="560" y="515" font-family="Arial" font-size="12" font-weight="bold">
    Legend:
  </text>
  <rect x="560" y="525" width="15" height="15" fill="#e6f3ff" stroke="#000080" stroke-width="1"/>
  <text x="580" y="540" font-family="Arial" font-size="10">
    Pipeline Stages
  </text>
  <rect x="560" y="545" width="15" height="15" fill="#fff0f5" stroke="#8b0000" stroke-width="1"/>
  <text x="580" y="560" font-family="Arial" font-size="10">
    Shared Storage
  </text>
</svg>